sources:
  '1.17.0':
    url: https://github.com/google/googletest
    tag: v1.17.0
    commit: 52eb8108c5bdec04579160ae17225d66034bd723
patches:
  '1.17.0':
  - patch_file: patches/1.17.0-0001-fix-clang22-char8-conversion.patch
build:
  options:
    BUILD_SHARED_LIBS: false
    BUILD_GMOCK: false
    INSTALL_GTEST: true
    GTEST_HAS_ABSL: true
    gtest_build_tests: false
    gtest_build_samples: false
    gtest_force_shared_crt: false
  install: true
package:
  cmake_file_name: GTest
  cmake_target_name: GTest
  components:
    gtest:
      target: GTest::gtest
      libs:
      - gtest
    gtest_main:
      target: GTest::gtest_main
      libs:
      - gtest_main
