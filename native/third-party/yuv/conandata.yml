sources:
  0.0.1892:
    url: https://github.com/lemenkov/libyuv
    commit: 9d98aaefe7a5e2710aa6175d44da38892400b381
patches:
  0.0.1892:
  - patch_file: patches/yuv.patch
  - patch_file: patches/yuv-static-only.patch
requirements:
- mimalloc/3.5.3@ysm/stable
build:
  global_link_targets:
  - mimalloc-static
  options:
    LIBYUV_BUILD_SHARED_LIBRARY: false
    LIBYUV_BUILD_TOOLS: false
    UNIT_TEST: false
  install: true
package:
  cmake_file_name: yuv
  cmake_target_name: yuv
  manual_headers:
  - dst: include
    pattern: '*'
    src: include
